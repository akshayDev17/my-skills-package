# CI — the checks that cost nothing and catch the things a human cannot see.
#
# Both gates here exist because a published package can be *wrong while every test
# passes*. `coursework-author@1.0.0` shipped without `.claude-plugin/plugin.json`
# (npm's `files` allowlist drops dotfiles silently, so the Claude host got nothing)
# and carried a `.claude-plugin/plugin.json` that said 1.1.0 while package.json said
# 1.0.0. Neither is visible to a test that reads package.json, and neither breaks the
# install — they only break one of the four hosts. So both are checked mechanically:
# the tarball must contain everything on disk, and the manifests must agree.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publishable:
    name: publishable as-is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      # Every host may read anything in the package dir, so everything must ship.
      - name: Tarball contains every on-disk file
        run: node scripts/check-package-contents.mjs

      # Names and versions must be identical across package.json, plugin.json and
      # .claude-plugin/plugin.json; entry points must resolve; each skill's SKILL.md
      # must declare the name it is mounted under.
      - name: Host manifests agree
        run: node scripts/check-manifests.mjs

      # A release re-run bumps to the version it is already at. That used to be
      # reported as "no version field found" (the no-op replace and the missing
      # field were the same branch), which failed the very re-run it existed to
      # make possible — so the recovery path a failed release needs was broken.
      - name: Bump is idempotent and touches every manifest
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R packages/coursework-author "$tmp/pkg"
          mkdir -p "$tmp/.claude-plugin" "$tmp/.agents/plugins"
          cp .claude-plugin/marketplace.json "$tmp/.claude-plugin/"
          cp .agents/plugins/marketplace.json "$tmp/.agents/plugins/"
          v=$(node -p "require('./packages/coursework-author/package.json').version")
          node scripts/bump-package.mjs "$tmp/pkg" "$v"
          node scripts/bump-package.mjs "$tmp/pkg" 9.9.9
          for f in package.json plugin.json .claude-plugin/plugin.json; do
            grep -q '"version": "9.9.9"' "$tmp/pkg/$f" || { echo "::error::$f was not bumped"; exit 1; }
          done
          # The catalogues pin a range, which is what Claude/Codex/Gemini install
          # from; a bump that skips them is a release those hosts never see.
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            grep -q '"version": "\^9.9.9"' "$f" || { echo "::error::$f pin was not bumped"; exit 1; }
          done

          # A check that mutates the checkout poisons every later step, and the damage
          # looks like a *different* check failing — which is exactly how this step's
          # 9.9.9 sentinel first surfaced: as a stale pin in the repo, one step later.
          cd "$GITHUB_WORKSPACE"
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error title=CI mutated the checkout::$dirty"
            exit 1
          fi
          echo "bump-package: idempotent at the current version, complete at a new one"
          echo "workspace=$GITHUB_WORKSPACE tmp=$tmp (checkout clean)"

      # The pin that sent the video package's hosts to a six-release-old version.
      # Nothing read these before; now something does.
      #
      # The failure is echoed as an annotation as well as to the log: reading a job's
      # log needs admin rights, annotations do not, so a red run explains itself to
      # whoever has the repo rather than to whoever has the credentials.
      - name: Marketplace pins track each package
        run: |
          set -euo pipefail
          if out=$(node scripts/check-marketplace-pins.mjs 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          msg=$(printf '%s\n' "$out" | grep '✗' | head -3 | tr '\n' ' ' || true)
          echo "::error title=marketplace pins stale::${msg:-no detail (see log)}"
          exit 1

      - name: Scripts parse
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.mjs)
          [ ${#files[@]} -gt 0 ] || { echo "no scripts matched — the layout moved"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "parsed ${#files[@]} files"
