[project]
name = "graph-notes-mcp"
version = "0.1.0"
description = "A local MCP server for graph-notes: read and edit your graphs as notes and links from any MCP harness."
requires-python = ">=3.11"
# An exact pin, as FastMCP's versioning policy asks: a minor release may break.
dependencies = ["fastmcp==4.2.0"]

[project.scripts]
graph-notes-mcp = "graph_notes_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
